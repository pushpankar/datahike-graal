name: Native Datahike

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [all, api, local, file, core, relational, safe, precise]
        default: all
      optimization:
        type: choice
        options: ['2', s]
        default: '2'
      fixture_run:
        description: Reuse fixtures from this run ID (empty creates new fixtures)
        type: string
      compare_datomic:
        description: Collect a Datomic type inventory on the same toolchain
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    if: ${{ !inputs.fixture_run }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create persistent fixtures in separate native processes
        run: |
          mkdir -p target/upstream
          curl -fL --retry 2 https://github.com/replikativ/datahike/releases/download/0.8.1913/datahike-0.8.1913-macos-aarch64.zip -o target/upstream/datahike.zip
          unzip -o target/upstream/datahike.zip -d target/upstream
          chmod +x target/upstream/dthk
          python3 scripts/create-test-db.py 3 2 10000 100000 1000000
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-fixtures
          path: |
            target/db-*
            target/config-*.edn
          retention-days: 3

  build:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profile && inputs.profile != 'all' && format('["{0}"]', inputs.profile) || '["api","local"]') }}
    runs-on: macos-15
    timeout-minutes: ${{ matrix.profile == 'precise' && 20 || 35 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/graal
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.5.1664
      - uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/.cache/m2
          key: macos-arm64-maven-${{ hashFiles('deps.edn') }}
      - name: Compile
        env:
          DATAHIKE_OPTIMIZATION: ${{ inputs.optimization || '2' }}
        run: |
          mkdir -p target
          set -o pipefail
          native-image --version
          bash build.sh '${{ matrix.profile }}' 2>&1 | tee target/build.log
          gzip -k -9 target/datahike-demo
          command -v xz || HOMEBREW_NO_AUTO_UPDATE=1 brew install xz
          xz -9e -k target/datahike-demo
          wc -c target/datahike-demo target/datahike-demo.gz target/datahike-demo.xz | tee target/sizes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.profile }}
          path: |
            target/datahike-demo.gz
            target/datahike-demo.xz
            target/build.log
            target/build-gc.log
            target/sizes.txt
            target/reports/universe_analysis*.txt
          retention-days: 7

  datomic-inventory:
    if: ${{ inputs.compare_datomic }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/graal
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.5.1664
      - uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/.cache/m2
          key: macos-arm64-datomic-maven-${{ hashFiles('datomic/deps.edn') }}
      - name: Build unchanged Datomic baseline with a type inventory
        working-directory: datomic
        run: |
          mkdir -p target
          set -o pipefail
          native-image --version
          bash build.sh 2>&1 | tee target/build.log
          target/datomic-demo query target/test-db 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datomic-inventory
          path: |
            datomic/target/build.log
            datomic/target/reports/universe_analysis*.txt
          retention-days: 7

  benchmark:
    needs: [fixtures, build]
    if: ${{ always() && (needs.fixtures.result == 'success' || needs.fixtures.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profile && inputs.profile != 'all' && format('["{0}"]', inputs.profile) || '["api","local"]') }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.profile }}
          path: target
      - uses: actions/download-artifact@v4
        with:
          name: persistent-fixtures
          path: target
          run-id: ${{ inputs.fixture_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Measure startup and verify database operations
        run: |
          gzip -dk target/datahike-demo.gz
          chmod +x target/datahike-demo
          python3 benchmark.py target/datahike-demo | tee target/benchmark.log
          target/datahike-demo target/config-3.edn check
          test "$(target/datahike-demo target/config-3.edn 2 | tail -n 1)" = '"Updated note"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurements-${{ matrix.profile }}
          path: |
            target/benchmark-datahike-demo.json
            target/benchmark.log
          retention-days: 7
